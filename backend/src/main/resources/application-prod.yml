server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    com.example.usercenter: INFO

app:
  public-base-url: ${PUBLIC_BASE_URL:https://kejinphotoarchive.com}
  storage:
    root: ${PHOTO_STORAGE_ROOT}
    max-file-size-bytes: ${PHOTO_MAX_FILE_SIZE_BYTES:20971520}
    max-image-pixels: ${PHOTO_MAX_IMAGE_PIXELS:80000000}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
