server {
    listen 80;
    listen [::]:80;
    server_name kejinphotoarchive.com www.kejinphotoarchive.com;
    return 301 https://kejinphotoarchive.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kejinphotoarchive.com;

    ssl_certificate /etc/letsencrypt/live/kejinphotoarchive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kejinphotoarchive.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kejinphotoarchive.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kejinphotoarchive.com;

    ssl_certificate /etc/letsencrypt/live/kejinphotoarchive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kejinphotoarchive.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/kejin-photo-archive/app/frontend;
    index index.html;
    client_max_body_size 22m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Always revalidate the SPA entry point so deployments are visible
    # immediately. Versioned JS/CSS assets can then be cached safely.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
